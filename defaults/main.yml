---
# defaults file for serverdns
serverdns_files_dir: "{{ role_path }}/files"
serverdns_templates_dir: "{{ role_path }}/templates"
serverdns_vars_dir: "{{ role_path }}/vars"
serverdns_software: "bind9"
serverdns_service: "named"
serverdns_packages: []
#  - "bind"
# Defaults for zones
dns_default_zone_ttl: "1W"
dns_default_zone_refresh: "86400"
dns_default_zone_update_retry: "7200"
dns_default_zone_expiry: "604800"
dns_default_zone_minimum: "86400"
# - bind9
bind9_config_dir:
# - path: "/etc/bind"
bind9_config_dirs:
# - path: "/var/bind/pri"
#   link: "/etc/bind/pri"
#   relative: true
# - path: "/var/bind/dyn"
#   link: "/etc/bind/dyn"
#   relative: true
# - path: "/var/bind/sec"
#   link: "/etc/bind/sec"
#   relative: true
bind9_config_file: "{{ bind9_config_dir }}/named.conf"
bind9_cache_data: "/var/bind/named.cache"
