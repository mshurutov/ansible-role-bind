---
# tasks file for serverdns
- name: Prepare role
  tags:
    - serverdns_install
    - dns_config
    - bind9
    - bind9_config
    - bind9_config_dirs
    - bind9_config_file
    - bind9_config_zone
  block:
    - name: Check prerequisites
      ansible.builtin.import_role:
        name: "mshurutov.common"
        tasks_from: "prereqs.yml"
    - name: Set distro independed variables
      ansible.builtin.include_vars:
        file: "{{ serverdns_vars_dir }}/main.yml"

- name: Install DNS server software
  become: true
  become_user: root
  tags:
    - serverdns_install
  block:
    # Package cache should be updated before install packages
    # by apt and apt+rpm package managers
    # Update apt cache
    - name: Update package manager cache for apt
      when: ansible_pkg_mgr == "apt"
      ansible.builtin.apt:
        update_cache: true
    # Update apt+rpm cache
    - name: Update package manager cache for apt+rpm
      when: ansible_pkg_mgr == "apt_rpm"
      community.general.apt_rpm:
        update_cache: true
    - name: Install packages
      notify:
        - Enable {{ serverdns_service }}
        - Start {{ serverdns_service }}
      block:
        - name: Install on non Alt Linux system
          when: ansible_pkg_mgr != "apt_rpm"
          ansible.builtin.package:
            name: "{{ item }}"
            state: "present"
          loop: "{{ serverdns_packages }}"
        - name: Install on Alt Linux system
          when: ansible_pkg_mgr == "apt_rpm"
          ansible.builtin.package:
            name: "{{ item }}"
            state: "present_not_latest"
          loop: "{{ serverdns_packages }}"

- name: Configure DNS server
  become: true
  become_user: root
  tags: dns_config
  block:
    - name: Configure BIND9 DNS server
      ansible.builtin.import_tasks: "bind9.yml"
      when: serverdns_software == "bind9"
      tags: bind9,bind9_config
